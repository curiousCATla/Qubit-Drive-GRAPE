<!-- chi explanation -->
<text x="320" y="404" font-size="12.5" fill="#1f2733"><tspan font-weight="700" font-style="italic">χ</tspan> (dispersive shift): the cavity's frequency depends on the transmon's state, and the transmon's</text>
<text x="320" y="421" font-size="12.5" fill="#1f2733">frequency depends on the photon number. That is how a microwave drive can address one photon number.</text>

